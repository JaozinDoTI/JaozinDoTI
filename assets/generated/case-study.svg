      <circle class="cosmic-star cosmic-star-near" cx="344.2" cy="11.1" r="1.33" fill="#ffffff" opacity="0.67" style="--star-low:0.44; --star-high:0.91; animation-duration:7.0s; animation-delay:-1.0s"/>
