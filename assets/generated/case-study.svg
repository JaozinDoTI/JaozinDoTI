      <circle class="cosmic-star cosmic-star-far" cx="591.8" cy="223.1" r="0.62" fill="#ffffff" opacity="0.12" style="--star-low:0.08; --star-high:0.16; animation-duration:11.4s; animation-delay:-7.6s"/>
      <circle class="cosmic-star cosmic-star-far" cx="682.8" cy="48.4" r="0.55" fill="#ffffff" opacity="0.11" style="--star-low:0.07; --star-high:0.14; animation-duration:13.4s; animation-delay:-7.6s"/>
