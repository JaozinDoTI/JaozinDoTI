<svg xmlns="http://www.w3.org/2000/svg" width="850" height="270" viewBox="0 0 850 270">
  <defs>
    <style>
      .cosmic-star {
        animation: cosmic-twinkle ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .cosmic-drift-far { animation: cosmic-drift-far 34s ease-in-out infinite alternate; }
      .cosmic-drift-mid { animation: cosmic-drift-mid 27s ease-in-out infinite alternate; }
      .cosmic-drift-near { animation: cosmic-drift-near 21s ease-in-out infinite alternate; }
      .cosmic-flash { animation: cosmic-flash 13s ease-in-out infinite; }
      @keyframes cosmic-twinkle {
        0%, 100% { opacity: var(--star-low); transform: scale(0.92); }
        48% { opacity: var(--star-high); transform: scale(1.05); }
      }
      @keyframes cosmic-drift-far { from { transform: translate(-2px, 1px); } to { transform: translate(3px, -1px); } }
      @keyframes cosmic-drift-mid { from { transform: translate(2px, -1px); } to { transform: translate(-3px, 2px); } }
      @keyframes cosmic-drift-near { from { transform: translate(-1px, -2px); } to { transform: translate(2px, 2px); } }
      @keyframes cosmic-flash { 0%, 88%, 100% { opacity: 0.08; } 91% { opacity: 0.75; } 94% { opacity: 0.14; } }
      @media (prefers-reduced-motion: reduce) {
        svg * { animation: none !important; }
      }
    </style>
    <filter id="cosmic-card-production-case-nebula-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="cosmic-card-production-case-bright-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.2" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cosmic-card-production-case-clip">
      <rect x="0" y="0" width="850" height="270" rx="12" ry="12"/>
    </clipPath>
    <radialGradient id="engine-halo"><stop stop-color="#00d4ff" stop-opacity=".20"/><stop offset="1" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
    <style>
      .case-core { animation:case-core 5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      .case-ring { animation:case-ring 32s linear infinite; transform-origin:425px 146px; }
      .case-data { animation:case-data 3.4s ease-in-out var(--case-delay,0s) infinite; }
      @keyframes case-core { 0%,100% { opacity:.65; transform:scale(.96); } 50% { opacity:1; transform:scale(1.04); } }
      @keyframes case-ring { to { transform:rotate(360deg); } }
      @keyframes case-data { 0%,100% { opacity:.18; transform:translateX(-7px); } 50% { opacity:1; transform:translateX(7px); } }
    </style>
  </defs>
  <rect data-svg-layer="background" width="850" height="270" fill="#0f1623"/>
  <g data-cosmic-background="card" aria-hidden="true" clip-path="url(#cosmic-card-production-case-clip)">
    <g class="cosmic-nebulae">
      <circle cx="400.4" cy="66.3" r="45.4" fill="#00d4ff" opacity="0.025" filter="url(#cosmic-card-production-case-nebula-blur)"/>
      <circle cx="200.2" cy="81.2" r="66.0" fill="#a78bfa" opacity="0.031" filter="url(#cosmic-card-production-case-nebula-blur)"/>
    </g>
    <g class="cosmic-dust" fill="#ffffff" opacity="0.12">
      <circle cx="78.3" cy="16.3" r="0.40"/>
      <circle cx="311.6" cy="164.6" r="0.38"/>
      <circle cx="468.1" cy="123.0" r="0.33"/>
      <circle cx="457.3" cy="225.6" r="0.29"/>
      <circle cx="830.3" cy="109.1" r="0.30"/>
    </g>
    <g data-cosmic-layer="far" class="cosmic-drift-far">
      <circle class="cosmic-star cosmic-star-far" cx="478.9" cy="70.6" r="0.68" fill="#00d4ff" opacity="0.26" style="--star-low:0.17; --star-high:0.35; animation-duration:12.7s; animation-delay:-11.7s"/>
      <circle class="cosmic-star cosmic-star-far" cx="579.8" cy="263.4" r="0.49" fill="#ffffff" opacity="0.14" style="--star-low:0.09; --star-high:0.18; animation-duration:11.3s; animation-delay:-14.6s"/>
      <circle class="cosmic-star cosmic-star-far" cx="534.0" cy="184.3" r="0.44" fill="#ffffff" opacity="0.15" style="--star-low:0.10; --star-high:0.20; animation-duration:9.9s; animation-delay:-3.2s"/>
      <circle class="cosmic-star cosmic-star-far" cx="180.4" cy="116.6" r="0.41" fill="#ffffff" opacity="0.17" style="--star-low:0.11; --star-high:0.23; animation-duration:11.5s; animation-delay:-9.7s"/>
      <circle class="cosmic-star cosmic-star-far" cx="500.2" cy="205.9" r="0.60" fill="#ffffff" opacity="0.15" style="--star-low:0.10; --star-high:0.21; animation-duration:10.2s; animation-delay:-3.5s"/>
      <circle class="cosmic-star cosmic-star-far" cx="783.6" cy="100.4" r="0.60" fill="#ffffff" opacity="0.11" style="--star-low:0.07; --star-high:0.14; animation-duration:13.5s; animation-delay:-14.3s"/>
      <circle class="cosmic-star cosmic-star-far" cx="264.0" cy="138.7" r="0.59" fill="#ffffff" opacity="0.08" style="--star-low:0.05; --star-high:0.11; animation-duration:12.6s; animation-delay:-11.0s"/>
      <circle class="cosmic-star cosmic-star-far" cx="21.1" cy="231.5" r="0.67" fill="#ffffff" opacity="0.25" style="--star-low:0.16; --star-high:0.33; animation-duration:10.4s; animation-delay:-8.9s"/>
      <circle class="cosmic-star cosmic-star-far" cx="350.2" cy="199.0" r="0.28" fill="#ffffff" opacity="0.22" style="--star-low:0.14; --star-high:0.29; animation-duration:12.2s; animation-delay:-4.6s"/>
      <circle class="cosmic-star cosmic-star-far" cx="822.3" cy="194.2" r="0.44" fill="#ffffff" opacity="0.08" style="--star-low:0.05; --star-high:0.11; animation-duration:13.6s; animation-delay:-11.9s"/>
    </g>
    <g data-cosmic-layer="mid" class="cosmic-drift-mid">
      <circle class="cosmic-star cosmic-star-mid" cx="371.7" cy="103.0" r="0.60" fill="#a78bfa" opacity="0.16" style="--star-low:0.11; --star-high:0.22; animation-duration:8.0s; animation-delay:-8.1s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="544.6" cy="157.6" r="0.81" fill="#ffffff" opacity="0.25" style="--star-low:0.16; --star-high:0.33; animation-duration:6.8s; animation-delay:-9.9s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="473.6" cy="88.2" r="0.50" fill="#ffffff" opacity="0.16" style="--star-low:0.10; --star-high:0.21; animation-duration:10.5s; animation-delay:-3.4s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="818.2" cy="27.6" r="0.95" fill="#ffffff" opacity="0.44" style="--star-low:0.29; --star-high:0.59; animation-duration:7.5s; animation-delay:-6.9s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="288.9" cy="62.7" r="0.59" fill="#ffffff" opacity="0.29" style="--star-low:0.19; --star-high:0.40; animation-duration:11.8s; animation-delay:-6.0s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="22.8" cy="125.6" r="0.73" fill="#ffffff" opacity="0.39" style="--star-low:0.26; --star-high:0.53; animation-duration:9.3s; animation-delay:-5.1s"/>
    </g>
    <g data-cosmic-layer="near" class="cosmic-drift-near">
      <circle class="cosmic-star cosmic-star-near" cx="246.7" cy="206.1" r="1.06" fill="#ffb020" opacity="0.37" filter="url(#cosmic-card-production-case-bright-glow)" style="--star-low:0.24; --star-high:0.49; animation-duration:5.8s; animation-delay:-4.8s"/>
      <circle class="cosmic-star cosmic-star-near" cx="52.6" cy="14.4" r="1.08" fill="#ffffff" opacity="0.41" style="--star-low:0.27; --star-high:0.55; animation-duration:9.0s; animation-delay:-6.7s"/>
      <circle class="cosmic-star cosmic-star-near" cx="802.1" cy="175.9" r="0.95" fill="#ffffff" opacity="0.57" style="--star-low:0.37; --star-high:0.76; animation-duration:8.1s; animation-delay:-2.7s"/>
    </g>
    <circle class="cosmic-flash" cx="257.4" cy="151.8" r="1.8" fill="#00d4ff" opacity="0.08" filter="url(#cosmic-card-production-case-bright-glow)" style="animation-delay:-0.0s"/>
  </g>
  <g data-svg-layer="content">
    <line x1="425" y1="0" x2="425" y2="17" stroke="#00d4ff" opacity="0.4"/>
    <text x="35" y="36" fill="#64748b" font-size="10" font-family="monospace" letter-spacing="3">PRODUCTION CASE • DATA VALIDATION</text>
    <rect x="670" y="20" width="145" height="21" rx="10" fill="#00d4ff" opacity="0.09" stroke="#00d4ff" stroke-opacity="0.28"/>
    <circle cx="686" cy="30.5" r="3" fill="#00d4ff" class="case-core"/>
    <text x="744" y="34" text-anchor="middle" fill="#00d4ff" font-size="8" font-weight="bold" font-family="monospace">RUNNING IN PRODUCTION</text>
    <line x1="35" y1="54" x2="815" y2="54" stroke="#1a2332" opacity="0.5"/>

    <g>
      <text x="70" y="91" fill="#ffb020" font-size="9" font-weight="bold" font-family="monospace" letter-spacing="1">VALIDATION CHALLENGE</text>
      <text x="70" y="119" fill="#f1f5f9" font-size="15" font-weight="bold" font-family="sans-serif">Data validation</text>
      <text x="70" y="140" fill="#94a3b8" font-size="11" font-family="sans-serif">High data volume</text>
      <text x="70" y="158" fill="#94a3b8" font-size="11" font-family="sans-serif">Complex business rules</text>
      <text x="70" y="176" fill="#94a3b8" font-size="11" font-family="sans-serif">Repetitive validation</text>
      <rect x="57" y="76" width="210" height="118" rx="12" fill="#ffb020" opacity="0.035" stroke="#ffb020" stroke-opacity="0.24"/>
    </g>

    <path d="M267 135 C310 135 325 146 353 146" fill="none" stroke="#00d4ff" stroke-width="1" stroke-dasharray="4 6" opacity="0.5"/>
    <circle cx="292" cy="139" r="2.4" fill="#00d4ff" class="case-data" style="--case-delay:.3s"/>
    <circle cx="323" cy="144" r="2" fill="#a78bfa" class="case-data" style="--case-delay:1.1s"/>

    <g class="case-core">
      <circle cx="425" cy="146" r="72" fill="url(#engine-halo)"/>
      <circle cx="425" cy="146" r="56" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="3 8" opacity="0.44" class="case-ring"/>
      <circle cx="425" cy="146" r="42" fill="#080c14" stroke="#a78bfa" stroke-width="1" stroke-opacity="0.55"/>
      <text x="425" y="135" text-anchor="middle" fill="#00d4ff" font-size="10" font-weight="bold" font-family="monospace">RULES + DATA</text>
      <text x="425" y="154" text-anchor="middle" fill="#f1f5f9" font-size="13" font-weight="bold" font-family="sans-serif">PROCESSING ENGINE</text>
      <text x="425" y="173" text-anchor="middle" fill="#64748b" font-size="8" font-family="monospace">VALIDATE • PROCESS • TRACE</text>
    </g>

    <path d="M497 146 C530 146 548 135 583 135" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4 6" opacity="0.5"/>
    <circle cx="526" cy="142" r="2" fill="#a78bfa" class="case-data" style="--case-delay:.8s"/>
    <circle cx="557" cy="137" r="2.4" fill="#00d4ff" class="case-data" style="--case-delay:1.5s"/>

    <g>
      <rect x="583" y="76" width="210" height="118" rx="12" fill="#00d4ff" opacity="0.035" stroke="#00d4ff" stroke-opacity="0.24"/>
      <text x="603" y="91" fill="#00d4ff" font-size="9" font-weight="bold" font-family="monospace" letter-spacing="1">PRODUCTION SYSTEM</text>
      <text x="603" y="119" fill="#f1f5f9" font-size="15" font-weight="bold" font-family="sans-serif">Production software</text>
      <text x="603" y="140" fill="#94a3b8" font-size="11" font-family="sans-serif">Batch processing</text>
      <text x="603" y="158" fill="#94a3b8" font-size="11" font-family="sans-serif">Traceable execution</text>
      <text x="603" y="176" fill="#94a3b8" font-size="11" font-family="sans-serif">Consistent results</text>
    </g>

    <rect x="57" y="211" width="736" height="34" rx="17" fill="#080c14" stroke="#1a2332"/>
    <text x="77" y="232" fill="#a78bfa" font-size="8" font-weight="bold" font-family="monospace">TECHNICAL OWNERSHIP</text>
    <text x="220" y="232" fill="#94a3b8" font-size="9" font-family="monospace">ARCHITECTURE • BACKEND • DATA • INTEGRATIONS</text>
    <line x1="425" y1="253" x2="425" y2="270" stroke="#a78bfa" opacity="0.4"/>
  </g>
</svg>