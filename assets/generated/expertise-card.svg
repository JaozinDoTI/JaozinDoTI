    </g>
    <circle class="cosmic-flash" cx="297.7" cy="47.3" r="1.8" fill="#00d4ff" opacity="0.08" filter="url(#cosmic-card-expertise-card-bright-glow)" style="animation-delay:-0.0s"/>
