      <circle class="cosmic-star cosmic-star-near" cx="131.3" cy="95.0" r="1.35" fill="#ffffff" opacity="0.50" style="--star-low:0.32; --star-high:0.67; animation-duration:4.8s; animation-delay:-4.4s"/>
