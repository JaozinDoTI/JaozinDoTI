<svg xmlns="http://www.w3.org/2000/svg" width="850" height="285" viewBox="0 0 850 285">
  <defs>
    <style>
      .cosmic-star {
        animation: cosmic-twinkle ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .cosmic-drift-far { animation: cosmic-drift-far 34s ease-in-out infinite alternate; }
      .cosmic-drift-mid { animation: cosmic-drift-mid 27s ease-in-out infinite alternate; }
      .cosmic-drift-near { animation: cosmic-drift-near 21s ease-in-out infinite alternate; }
      .cosmic-flash { animation: cosmic-flash 13s ease-in-out infinite; }
      @keyframes cosmic-twinkle {
        0%, 100% { opacity: var(--star-low); transform: scale(0.92); }
        48% { opacity: var(--star-high); transform: scale(1.05); }
      }
      @keyframes cosmic-drift-far { from { transform: translate(-2px, 1px); } to { transform: translate(3px, -1px); } }
      @keyframes cosmic-drift-mid { from { transform: translate(2px, -1px); } to { transform: translate(-3px, 2px); } }
      @keyframes cosmic-drift-near { from { transform: translate(-1px, -2px); } to { transform: translate(2px, 2px); } }
      @keyframes cosmic-flash { 0%, 88%, 100% { opacity: 0.08; } 91% { opacity: 0.75; } 94% { opacity: 0.14; } }
      @media (prefers-reduced-motion: reduce) {
        svg * { animation: none !important; }
      }
    </style>
    <filter id="cosmic-card-technology-constellation-nebula-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="cosmic-card-technology-constellation-bright-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.2" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cosmic-card-technology-constellation-clip">
      <rect x="0" y="0" width="850" height="285" rx="12" ry="12"/>
    </clipPath>
    <style>
      .stack-node { animation:stack-enter .7s ease-out both; transform-box:fill-box; transform-origin:center; }
      .stack-node:nth-of-type(2n) { animation-delay:.15s; }
      .stack-pulse { animation:stack-pulse 4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      .stack-flow { animation:stack-flow 3.8s ease-in-out var(--stack-delay,0s) infinite; }
      @keyframes stack-enter { from { opacity:0; transform:scale(.85); } to { opacity:1; transform:scale(1); } }
      @keyframes stack-pulse { 0%,100% { opacity:.45; transform:scale(.8); } 50% { opacity:1; transform:scale(1.3); } }
      @keyframes stack-flow { 0%,100% { opacity:.18; transform:translateX(-14px); } 50% { opacity:.9; transform:translateX(14px); } }
    </style>
  </defs>
