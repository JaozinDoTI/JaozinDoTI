      <circle class="cosmic-star cosmic-star-far" cx="774.7" cy="37.4" r="0.42" fill="#ffffff" opacity="0.27" style="--star-low:0.18; --star-high:0.37; animation-duration:12.4s; animation-delay:-2.2s"/>
      <circle class="cosmic-star cosmic-star-far" cx="156.2" cy="156.5" r="0.32" fill="#ffffff" opacity="0.22" style="--star-low:0.14; --star-high:0.30; animation-duration:9.6s; animation-delay:-15.2s"/>
