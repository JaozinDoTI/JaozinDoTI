<svg xmlns="http://www.w3.org/2000/svg" width="850" height="310" viewBox="0 0 850 310">
  <defs>
    <style>
      .cosmic-star {
        animation: cosmic-twinkle ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .cosmic-drift-far { animation: cosmic-drift-far 34s ease-in-out infinite alternate; }
      .cosmic-drift-mid { animation: cosmic-drift-mid 27s ease-in-out infinite alternate; }
      .cosmic-drift-near { animation: cosmic-drift-near 21s ease-in-out infinite alternate; }
      .cosmic-flash { animation: cosmic-flash 13s ease-in-out infinite; }
      @keyframes cosmic-twinkle {
        0%, 100% { opacity: var(--star-low); transform: scale(0.92); }
        48% { opacity: var(--star-high); transform: scale(1.05); }
      }
      @keyframes cosmic-drift-far { from { transform: translate(-2px, 1px); } to { transform: translate(3px, -1px); } }
      @keyframes cosmic-drift-mid { from { transform: translate(2px, -1px); } to { transform: translate(-3px, 2px); } }
      @keyframes cosmic-drift-near { from { transform: translate(-1px, -2px); } to { transform: translate(2px, 2px); } }
      @keyframes cosmic-flash { 0%, 88%, 100% { opacity: 0.08; } 91% { opacity: 0.75; } 94% { opacity: 0.14; } }
      @media (prefers-reduced-motion: reduce) {
        svg * { animation: none !important; }
      }
    </style>
    <filter id="cosmic-card-featured-systems-nebula-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="cosmic-card-featured-systems-bright-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.2" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cosmic-card-featured-systems-clip">
      <rect x="0" y="0" width="850" height="310" rx="12" ry="12"/>
    </clipPath>
    <linearGradient id="featured-glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb020" stop-opacity=".11"/><stop offset=".6" stop-color="#080c14" stop-opacity=".88"/></linearGradient>
    <style>
      .product-enter { opacity:0; animation:product-enter .8s ease-out var(--product-delay,0s) forwards; }
      .product-pulse { animation:product-pulse 4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      .product-orbit { animation:product-orbit 36s linear infinite; transform-origin:472px 117px; }
      @keyframes product-enter { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
      @keyframes product-pulse { 0%,100% { opacity:.5; transform:scale(.85); } 50% { opacity:1; transform:scale(1.18); } }
      @keyframes product-orbit { to { transform:rotate(360deg); } }
    </style>
  </defs>
  <rect data-svg-layer="background" width="850" height="310" fill="#0f1623"/>
  <g data-cosmic-background="card" aria-hidden="true" clip-path="url(#cosmic-card-featured-systems-clip)">
    <g class="cosmic-nebulae">
      <circle cx="599.2" cy="100.4" r="55.2" fill="#00d4ff" opacity="0.025" filter="url(#cosmic-card-featured-systems-nebula-blur)"/>
      <circle cx="233.9" cy="53.6" r="53.0" fill="#a78bfa" opacity="0.031" filter="url(#cosmic-card-featured-systems-nebula-blur)"/>
    </g>
    <g class="cosmic-dust" fill="#ffffff" opacity="0.12">
      <circle cx="19.9" cy="173.2" r="0.32"/>
      <circle cx="24.7" cy="285.9" r="0.33"/>
      <circle cx="463.0" cy="290.4" r="0.38"/>
      <circle cx="204.5" cy="123.0" r="0.27"/>
      <circle cx="691.2" cy="103.3" r="0.30"/>
    </g>
    <g data-cosmic-layer="far" class="cosmic-drift-far">
      <circle class="cosmic-star cosmic-star-far" cx="826.1" cy="195.6" r="0.63" fill="#00d4ff" opacity="0.24" style="--star-low:0.15; --star-high:0.32; animation-duration:15.8s; animation-delay:-2.9s"/>
      <circle class="cosmic-star cosmic-star-far" cx="365.6" cy="303.2" r="0.52" fill="#ffffff" opacity="0.24" style="--star-low:0.15; --star-high:0.32; animation-duration:10.9s; animation-delay:-4.8s"/>
      <circle class="cosmic-star cosmic-star-far" cx="121.2" cy="61.4" r="0.61" fill="#ffffff" opacity="0.13" style="--star-low:0.08; --star-high:0.17; animation-duration:14.0s; animation-delay:-1.7s"/>
      <circle class="cosmic-star cosmic-star-far" cx="118.2" cy="47.1" r="0.55" fill="#ffffff" opacity="0.11" style="--star-low:0.07; --star-high:0.15; animation-duration:12.4s; animation-delay:-0.1s"/>
      <circle class="cosmic-star cosmic-star-far" cx="577.8" cy="54.0" r="0.31" fill="#ffffff" opacity="0.10" style="--star-low:0.06; --star-high:0.13; animation-duration:9.9s; animation-delay:-1.6s"/>
      <circle class="cosmic-star cosmic-star-far" cx="447.1" cy="102.3" r="0.34" fill="#ffffff" opacity="0.16" style="--star-low:0.11; --star-high:0.22; animation-duration:15.6s; animation-delay:-0.2s"/>
      <circle class="cosmic-star cosmic-star-far" cx="743.0" cy="82.6" r="0.49" fill="#ffffff" opacity="0.09" style="--star-low:0.06; --star-high:0.12; animation-duration:12.9s; animation-delay:-6.2s"/>
      <circle class="cosmic-star cosmic-star-far" cx="280.6" cy="10.2" r="0.53" fill="#ffffff" opacity="0.21" style="--star-low:0.14; --star-high:0.29; animation-duration:9.5s; animation-delay:-10.4s"/>
      <circle class="cosmic-star cosmic-star-far" cx="530.3" cy="146.5" r="0.63" fill="#ffffff" opacity="0.12" style="--star-low:0.08; --star-high:0.16; animation-duration:9.2s; animation-delay:-2.1s"/>
      <circle class="cosmic-star cosmic-star-far" cx="836.2" cy="236.1" r="0.30" fill="#ffffff" opacity="0.22" style="--star-low:0.14; --star-high:0.29; animation-duration:13.5s; animation-delay:-6.7s"/>
    </g>
    <g data-cosmic-layer="mid" class="cosmic-drift-mid">
      <circle class="cosmic-star cosmic-star-mid" cx="220.4" cy="282.0" r="0.68" fill="#a78bfa" opacity="0.18" style="--star-low:0.11; --star-high:0.24; animation-duration:8.7s; animation-delay:-9.0s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="374.0" cy="207.9" r="0.66" fill="#ffffff" opacity="0.34" style="--star-low:0.22; --star-high:0.46; animation-duration:7.7s; animation-delay:-10.0s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="46.3" cy="197.2" r="0.59" fill="#ffffff" opacity="0.29" style="--star-low:0.19; --star-high:0.39; animation-duration:10.2s; animation-delay:-0.5s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="196.9" cy="244.6" r="0.56" fill="#ffffff" opacity="0.27" style="--star-low:0.18; --star-high:0.37; animation-duration:11.1s; animation-delay:-7.7s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="768.2" cy="212.5" r="0.83" fill="#ffffff" opacity="0.45" style="--star-low:0.29; --star-high:0.60; animation-duration:10.6s; animation-delay:-10.9s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="85.1" cy="185.9" r="0.72" fill="#ffffff" opacity="0.30" style="--star-low:0.19; --star-high:0.40; animation-duration:11.4s; animation-delay:-1.6s"/>
    </g>
    <g data-cosmic-layer="near" class="cosmic-drift-near">
      <circle class="cosmic-star cosmic-star-near" cx="669.6" cy="216.3" r="0.99" fill="#ffb020" opacity="0.65" filter="url(#cosmic-card-featured-systems-bright-glow)" style="--star-low:0.42; --star-high:0.87; animation-duration:7.0s; animation-delay:-6.7s"/>
      <circle class="cosmic-star cosmic-star-near" cx="260.3" cy="131.6" r="1.31" fill="#ffffff" opacity="0.58" style="--star-low:0.38; --star-high:0.78; animation-duration:7.7s; animation-delay:-3.9s"/>
      <circle class="cosmic-star cosmic-star-near" cx="170.6" cy="137.2" r="1.54" fill="#ffffff" opacity="0.49" style="--star-low:0.32; --star-high:0.66; animation-duration:6.7s; animation-delay:-6.2s"/>
    </g>
    <circle class="cosmic-flash" cx="710.0" cy="101.8" r="1.8" fill="#00d4ff" opacity="0.08" filter="url(#cosmic-card-featured-systems-bright-glow)" style="animation-delay:-0.0s"/>
  </g>
  <g data-svg-layer="content">
    <line x1="425" y1="0" x2="425" y2="17" stroke="#a78bfa" opacity="0.4"/>
    <text x="35" y="36" fill="#64748b" font-size="10" font-family="monospace" letter-spacing="3">FEATURED SYSTEMS</text>
    <text x="815" y="36" text-anchor="end" fill="#64748b" font-size="8" font-family="monospace">PROBLEM → SOFTWARE → IMPACT</text>
    <line x1="35" y1="52" x2="815" y2="52" stroke="#1a2332" opacity="0.5"/>

    <g class="product-enter" style="--product-delay:.12s">
      <rect x="35" y="70" width="500" height="210" rx="14" fill="url(#featured-glow)" stroke="#ffb020" stroke-opacity="0.38"/>
      <rect x="35" y="70" width="5" height="210" rx="2" fill="#ffb020" opacity="0.55"/>
      <text x="65" y="97" fill="#ffb020" font-size="8" font-weight="bold" font-family="monospace" letter-spacing="1.5">FLAGSHIP • PRODUCTION AUTOMATION</text>
      <text x="65" y="130" fill="#f1f5f9" font-size="25" font-weight="bold" font-family="sans-serif">PRISMA</text>
      <text x="65" y="151" fill="#94a3b8" font-size="11" font-family="sans-serif">Production platform for high-volume data validation and complex business rules.</text>

      <text x="65" y="185" fill="#64748b" font-size="8" font-weight="bold" font-family="monospace">PROBLEM</text>
      <text x="65" y="204" fill="#f1f5f9" font-size="11" font-family="sans-serif">Manual, high-volume data analysis</text>
      <text x="65" y="230" fill="#64748b" font-size="8" font-weight="bold" font-family="monospace">BUILT</text>
      <text x="65" y="249" fill="#f1f5f9" font-size="11" font-family="sans-serif">Automated validation and processing engine</text>
      <rect x="65" y="259" width="285" height="14" rx="7" fill="#ffb020" opacity="0.07"/>
      <text x="207" y="269" text-anchor="middle" fill="#ffb020" font-size="7" font-family="monospace">PYTHON • SQL • DATA PROCESSING • AUTOMATION</text>

      <circle cx="464" cy="130" r="55" fill="#ffb020" opacity="0.06"/>
      <circle cx="464" cy="130" r="40" fill="none" stroke="#ffb020" stroke-width="0.8" stroke-dasharray="3 8" opacity="0.40" class="product-orbit"/>
      <circle cx="464" cy="130" r="25" fill="#080c14" stroke="#ffb020" stroke-opacity="0.5"/>
      <text x="464" y="126" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="bold" font-family="sans-serif">~99.997%</text>
      <text x="464" y="143" text-anchor="middle" fill="#ffb020" font-size="7" font-weight="bold" font-family="monospace">LESS PROCESSING TIME</text>
      <path d="M365 204 C420 204 431 184 464 173" fill="none" stroke="#ffb020" stroke-width=".8" stroke-dasharray="3 6" opacity=".35"/>
    </g>
    <g class="product-enter" style="--product-delay:.35s">
      <rect x="560" y="70" width="255" height="210" rx="14" fill="#080c14" stroke="#00d4ff" stroke-opacity="0.30"/>
      <circle cx="590" cy="101" r="17" fill="#00d4ff" opacity="0.08"/>
      <circle cx="590" cy="101" r="5" fill="#00d4ff" class="product-pulse"/>
      <text x="620" y="99" fill="#f1f5f9" font-size="16" font-weight="bold" font-family="sans-serif">camup-system</text>
      <text x="620" y="115" fill="#00d4ff" font-size="8" font-family="monospace" letter-spacing="1">COLLABORATIVE WEB SYSTEM</text>
      <text x="582" y="148" fill="#64748b" font-size="8" font-weight="bold" font-family="monospace">CHALLENGE</text>
      <text x="582" y="167" fill="#94a3b8" font-size="10" font-family="sans-serif">Complex collaborative workflows</text>
      <text x="582" y="206" fill="#64748b" font-size="8" font-weight="bold" font-family="monospace">ENGINEERING</text>
      <text x="582" y="225" fill="#94a3b8" font-size="10" font-family="sans-serif">Backend evolution and feature</text>
      <text x="582" y="240" fill="#94a3b8" font-size="10" font-family="sans-serif">delivery</text>
      <rect x="580" y="250" width="215" height="20" rx="10" fill="#00d4ff" opacity="0.08"/>
      <text x="687" y="263" text-anchor="middle" fill="#00d4ff" font-size="8" font-family="monospace">PHP • LARAVEL • JAVASCRIPT • GIT</text>
    </g>
    <line x1="425" y1="294" x2="425" y2="310" stroke="#00d4ff" opacity="0.4"/>
  </g>
</svg>