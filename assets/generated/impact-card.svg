    </g>
    <g data-cosmic-layer="far" class="cosmic-drift-far">
      <circle class="cosmic-star cosmic-star-far" cx="311.7" cy="246.3" r="0.50" fill="#00d4ff" opacity="0.11" style="--star-low:0.07; --star-high:0.15; animation-duration:10.7s; animation-delay:-1.8s"/>
      <circle class="cosmic-star cosmic-star-far" cx="329.6" cy="47.5" r="0.30" fill="#ffffff" opacity="0.14" style="--star-low:0.09; --star-high:0.19; animation-duration:12.1s; animation-delay:-5.6s"/>
      <circle class="cosmic-star cosmic-star-far" cx="157.7" cy="27.1" r="0.62" fill="#ffffff" opacity="0.20" style="--star-low:0.13; --star-high:0.27; animation-duration:10.6s; animation-delay:-7.4s"/>
      <circle class="cosmic-star cosmic-star-far" cx="833.5" cy="133.7" r="0.30" fill="#ffffff" opacity="0.25" style="--star-low:0.16; --star-high:0.34; animation-duration:10.2s; animation-delay:-7.5s"/>
      <circle class="cosmic-star cosmic-star-far" cx="394.8" cy="30.6" r="0.49" fill="#ffffff" opacity="0.26" style="--star-low:0.17; --star-high:0.35; animation-duration:14.7s; animation-delay:-11.2s"/>
      <circle class="cosmic-star cosmic-star-far" cx="839.2" cy="200.1" r="0.29" fill="#ffffff" opacity="0.13" style="--star-low:0.09; --star-high:0.18; animation-duration:14.9s; animation-delay:-2.0s"/>
      <circle class="cosmic-star cosmic-star-far" cx="579.7" cy="115.7" r="0.62" fill="#ffffff" opacity="0.20" style="--star-low:0.13; --star-high:0.26; animation-duration:14.5s; animation-delay:-3.8s"/>
      <circle class="cosmic-star cosmic-star-far" cx="528.6" cy="238.4" r="0.48" fill="#ffffff" opacity="0.10" style="--star-low:0.06; --star-high:0.13; animation-duration:15.5s; animation-delay:-10.1s"/>
      <circle class="cosmic-star cosmic-star-far" cx="832.2" cy="226.2" r="0.58" fill="#ffffff" opacity="0.23" style="--star-low:0.15; --star-high:0.31; animation-duration:12.5s; animation-delay:-3.7s"/>
      <circle class="cosmic-star cosmic-star-far" cx="598.7" cy="191.0" r="0.43" fill="#ffffff" opacity="0.23" style="--star-low:0.15; --star-high:0.32; animation-duration:11.9s; animation-delay:-15.5s"/>
    </g>
