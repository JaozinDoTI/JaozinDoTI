<svg xmlns="http://www.w3.org/2000/svg" width="850" height="270" viewBox="0 0 850 270">
  <defs>
    <style>
      .cosmic-star {
        animation: cosmic-twinkle ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .cosmic-drift-far { animation: cosmic-drift-far 34s ease-in-out infinite alternate; }
      .cosmic-drift-mid { animation: cosmic-drift-mid 27s ease-in-out infinite alternate; }
      .cosmic-drift-near { animation: cosmic-drift-near 21s ease-in-out infinite alternate; }
      .cosmic-flash { animation: cosmic-flash 13s ease-in-out infinite; }
      @keyframes cosmic-twinkle {
        0%, 100% { opacity: var(--star-low); transform: scale(0.92); }
        48% { opacity: var(--star-high); transform: scale(1.05); }
      }
      @keyframes cosmic-drift-far { from { transform: translate(-2px, 1px); } to { transform: translate(3px, -1px); } }
      @keyframes cosmic-drift-mid { from { transform: translate(2px, -1px); } to { transform: translate(-3px, 2px); } }
      @keyframes cosmic-drift-near { from { transform: translate(-1px, -2px); } to { transform: translate(2px, 2px); } }
      @keyframes cosmic-flash { 0%, 88%, 100% { opacity: 0.08; } 91% { opacity: 0.75; } 94% { opacity: 0.14; } }
      @media (prefers-reduced-motion: reduce) {
        svg * { animation: none !important; }
      }
    </style>
    <filter id="cosmic-card-impact-proof-nebula-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="cosmic-card-impact-proof-bright-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.2" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cosmic-card-impact-proof-clip">
      <rect x="0" y="0" width="850" height="270" rx="12" ry="12"/>
    </clipPath>
    <radialGradient id="impact-halo"><stop offset="0%" stop-color="#00d4ff" stop-opacity="0.20"/><stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="impact-link" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00d4ff" stop-opacity="0.65"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0.08"/></linearGradient>
    <style>
      .impact-reveal { opacity:0; animation:impact-reveal .8s ease-out var(--impact-delay,0s) forwards; }
      .impact-orbit { animation:impact-orbit 28s linear infinite; }
      .impact-breathe { animation:impact-breathe 4.5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
      @keyframes impact-reveal { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
      @keyframes impact-orbit { to { transform:rotate(360deg); } }
      @keyframes impact-breathe { 0%,100% { opacity:.55; transform:scale(.96); } 50% { opacity:1; transform:scale(1.04); } }
    </style>
  </defs>
  <rect data-svg-layer="background" width="850" height="270" fill="#0f1623"/>
  <g data-cosmic-background="card" aria-hidden="true" clip-path="url(#cosmic-card-impact-proof-clip)">
    <g class="cosmic-nebulae">
      <circle cx="201.9" cy="108.9" r="56.7" fill="#00d4ff" opacity="0.025" filter="url(#cosmic-card-impact-proof-nebula-blur)"/>
      <circle cx="285.7" cy="50.8" r="70.1" fill="#a78bfa" opacity="0.031" filter="url(#cosmic-card-impact-proof-nebula-blur)"/>
    </g>
    <g class="cosmic-dust" fill="#ffffff" opacity="0.12">
      <circle cx="248.2" cy="200.9" r="0.20"/>
      <circle cx="708.5" cy="78.7" r="0.22"/>
      <circle cx="519.6" cy="95.4" r="0.35"/>
