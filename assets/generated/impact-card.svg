    <g class="impact-reveal" style="--impact-delay:0.35s">
      <circle cx="470" cy="125" r="43" fill="none" stroke="#a78bfa" stroke-width="0.7" stroke-dasharray="2 7" opacity="0.34" class="impact-orbit" style="transform-origin:470px 125px"/>
      <circle cx="470" cy="125" r="34" fill="#a78bfa" opacity="0.05"/>
      <text x="470" y="122" text-anchor="middle" fill="#f1f5f9" font-size="25" font-weight="bold" font-family="sans-serif">9.5×</text>
