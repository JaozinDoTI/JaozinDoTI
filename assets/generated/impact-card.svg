      <circle class="cosmic-star cosmic-star-mid" cx="402.6" cy="16.8" r="0.96" fill="#ffffff" opacity="0.29" style="--star-low:0.19; --star-high:0.40; animation-duration:7.3s; animation-delay:-6.9s"/>
