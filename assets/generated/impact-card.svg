      <circle cx="210" cy="139" r="104" fill="url(#impact-halo)" opacity="0.55" class="impact-breathe"/>
      <circle cx="210" cy="139" r="81" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="3 9" opacity="0.42" class="impact-orbit" style="transform-origin:210px 139px"/>
      <circle cx="210" cy="139" r="64" fill="#080c14" stroke="#00d4ff" stroke-width="1.2" stroke-opacity="0.30"/>
      <text x="210" y="135" text-anchor="middle" fill="#f1f5f9" font-size="43" font-weight="bold" font-family="sans-serif">~99.99%</text>
      <text x="210" y="159" text-anchor="middle" fill="#00d4ff" font-size="10" font-weight="bold" font-family="monospace" letter-spacing="1.2">LESS MANUAL WORK</text>
      <text x="210" y="180" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">in automated workflow steps</text>
