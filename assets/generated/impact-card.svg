    <g class="impact-reveal" style="--impact-delay:0.49s">
      <circle cx="620" cy="125" r="43" fill="none" stroke="#00d4ff" stroke-width="0.7" stroke-dasharray="2 7" opacity="0.34" class="impact-orbit" style="transform-origin:620px 125px"/>
      <circle cx="620" cy="125" r="34" fill="#00d4ff" opacity="0.05"/>
      <text x="620" y="122" text-anchor="middle" fill="#f1f5f9" font-size="25" font-weight="bold" font-family="sans-serif">-89.46%</text>
      <text x="620" y="143" text-anchor="middle" fill="#00d4ff" font-size="8" font-weight="bold" font-family="monospace" letter-spacing="0.8">EXPORT TIME</text>
      <text x="620" y="183" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">measured execution reduction</text>
