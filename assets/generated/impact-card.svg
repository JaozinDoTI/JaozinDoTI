      <circle class="cosmic-star cosmic-star-near" cx="271.9" cy="11.9" r="0.90" fill="#ffffff" opacity="0.70" style="--star-low:0.45; --star-high:0.92; animation-duration:5.1s; animation-delay:-3.7s"/>
