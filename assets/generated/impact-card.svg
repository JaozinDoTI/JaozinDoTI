      <circle class="cosmic-star cosmic-star-mid" cx="147.9" cy="203.5" r="0.82" fill="#ffffff" opacity="0.26" style="--star-low:0.17; --star-high:0.35; animation-duration:10.3s; animation-delay:-4.2s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="823.5" cy="188.2" r="1.04" fill="#ffffff" opacity="0.25" style="--star-low:0.16; --star-high:0.33; animation-duration:6.6s; animation-delay:-5.0s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="191.6" cy="214.3" r="0.94" fill="#ffffff" opacity="0.26" style="--star-low:0.17; --star-high:0.35; animation-duration:8.0s; animation-delay:-11.3s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="443.4" cy="15.4" r="0.69" fill="#ffffff" opacity="0.41" style="--star-low:0.26; --star-high:0.55; animation-duration:11.7s; animation-delay:-9.3s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="123.4" cy="57.1" r="0.73" fill="#ffffff" opacity="0.41" style="--star-low:0.27; --star-high:0.56; animation-duration:10.9s; animation-delay:-0.6s"/>
    </g>
    <g data-cosmic-layer="near" class="cosmic-drift-near">
      <circle class="cosmic-star cosmic-star-near" cx="83.3" cy="194.7" r="1.37" fill="#ffb020" opacity="0.68" filter="url(#cosmic-card-impact-proof-bright-glow)" style="--star-low:0.44; --star-high:0.92; animation-duration:5.6s; animation-delay:-4.8s"/>
      <circle class="cosmic-star cosmic-star-near" cx="108.1" cy="190.5" r="1.42" fill="#ffffff" opacity="0.30" style="--star-low:0.19; --star-high:0.40; animation-duration:6.3s; animation-delay:-7.0s"/>
      <circle class="cosmic-star cosmic-star-near" cx="817.5" cy="147.5" r="1.38" fill="#ffffff" opacity="0.49" style="--star-low:0.32; --star-high:0.67; animation-duration:6.2s; animation-delay:-0.5s"/>
    </g>
    <circle class="cosmic-flash" cx="105.5" cy="220.6" r="1.8" fill="#00d4ff" opacity="0.08" filter="url(#cosmic-card-impact-proof-bright-glow)" style="animation-delay:-0.0s"/>
  </g>
  <g data-svg-layer="content">
    <line x1="425" y1="0" x2="425" y2="18" stroke="#00d4ff" opacity="0.45"/><circle cx="425" cy="18" r="2" fill="#00d4ff"/>
    <text x="35" y="37" fill="#64748b" font-size="10" font-family="monospace" letter-spacing="3">PROOF OF IMPACT</text>
