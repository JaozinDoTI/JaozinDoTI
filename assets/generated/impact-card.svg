      <circle class="cosmic-star cosmic-star-mid" cx="734.5" cy="26.3" r="0.83" fill="#ffffff" opacity="0.26" style="--star-low:0.17; --star-high:0.35; animation-duration:9.4s; animation-delay:-10.3s"/>
