      <circle cx="760" cy="125" r="34" fill="#ffb020" opacity="0.05"/>
      <text x="760" y="122" text-anchor="middle" fill="#f1f5f9" font-size="25" font-weight="bold" font-family="sans-serif">+3.03%</text>
