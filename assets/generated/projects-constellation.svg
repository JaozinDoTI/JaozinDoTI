<svg xmlns="http://www.w3.org/2000/svg" width="850" height="220" viewBox="0 0 850 220">
  <defs>
    <style>
      .cosmic-star {
        animation: cosmic-twinkle ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      .cosmic-drift-far { animation: cosmic-drift-far 34s ease-in-out infinite alternate; }
      .cosmic-drift-mid { animation: cosmic-drift-mid 27s ease-in-out infinite alternate; }
      .cosmic-drift-near { animation: cosmic-drift-near 21s ease-in-out infinite alternate; }
      .cosmic-flash { animation: cosmic-flash 13s ease-in-out infinite; }
      @keyframes cosmic-twinkle {
        0%, 100% { opacity: var(--star-low); transform: scale(0.92); }
        48% { opacity: var(--star-high); transform: scale(1.05); }
      }
      @keyframes cosmic-drift-far { from { transform: translate(-2px, 1px); } to { transform: translate(3px, -1px); } }
      @keyframes cosmic-drift-mid { from { transform: translate(2px, -1px); } to { transform: translate(-3px, 2px); } }
      @keyframes cosmic-drift-near { from { transform: translate(-1px, -2px); } to { transform: translate(2px, 2px); } }
      @keyframes cosmic-flash { 0%, 88%, 100% { opacity: 0.08; } 91% { opacity: 0.75; } 94% { opacity: 0.14; } }
      @media (prefers-reduced-motion: reduce) {
        svg * { animation: none !important; }
      }
    </style>
    <filter id="cosmic-card-projects-constellation-nebula-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="cosmic-card-projects-constellation-bright-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.2" result="halo"/>
      <feMerge><feMergeNode in="halo"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cosmic-card-projects-constellation-clip">
      <rect x="0" y="0" width="850" height="220" rx="12" ry="12"/>
    </clipPath>
    <style>
      .svg-pulse-opacity { animation: svg-pulse-opacity var(--motion-duration, 4s) ease-in-out var(--motion-delay, 0s) infinite; }
      .svg-pulse-scale { animation: svg-pulse-scale var(--motion-duration, 3s) ease-in-out var(--motion-delay, 0s) infinite; transform-box: fill-box; transform-origin: center; }
      .svg-pulse-core { animation: svg-pulse-core var(--motion-duration, 3s) ease-in-out var(--motion-delay, 0s) infinite; transform-box: fill-box; transform-origin: center; }
      .svg-rotate { animation: svg-rotate var(--motion-duration, 12s) linear var(--motion-delay, 0s) infinite; transform-box: fill-box; transform-origin: center; }
      .svg-counter-rotate { animation: svg-counter-rotate var(--motion-duration, 20s) linear var(--motion-delay, 0s) infinite; transform-box: fill-box; transform-origin: center; }
      .svg-scan-y { animation: svg-scan-y var(--motion-duration, 6s) linear var(--motion-delay, 0s) infinite; }
      .svg-grow-x { animation: svg-grow-x var(--motion-duration, .8s) ease-out var(--motion-delay, 0s) both; transform-box: fill-box; transform-origin: left center; }
      .svg-scan-hit { animation: svg-scan-hit var(--motion-duration, 8s) linear var(--motion-delay, 0s) infinite; }
      @keyframes svg-pulse-opacity { 0%, 100% { opacity: var(--motion-low, .45); } 50% { opacity: var(--motion-high, 1); } }
      @keyframes svg-pulse-scale { 0%, 100% { transform: scale(var(--motion-scale-low, .82)); } 50% { transform: scale(var(--motion-scale-high, 1.18)); } }
      @keyframes svg-pulse-core { 0%, 100% { opacity: var(--motion-low, .5); transform: scale(.9); } 50% { opacity: var(--motion-high, .9); transform: scale(1.1); } }
      @keyframes svg-rotate { to { transform: rotate(360deg); } }
      @keyframes svg-counter-rotate { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes svg-scan-y { from { transform: translateY(0); } to { transform: translateY(var(--motion-distance, 140px)); } }
      @keyframes svg-grow-x { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes svg-scan-hit { 0%, 4%, 10%, 100% { opacity: .35; } 6% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .project-card { opacity: 1 !important; transform: none !important; }
      }
    </style>
    <filter id="proj-glow-0" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" in="SourceGraphic" result="blur"/>
      <feFlood flood-color="#ffb020" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="proj-glow-1" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" in="SourceGraphic" result="blur"/>
      <feFlood flood-color="#00d4ff" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="card-bg-0" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2332" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f1623" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="card-bg-1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2332" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f1623" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="conn-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb020" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.4"/>
    </linearGradient>
    <clipPath id="card-clip-0">
      <rect x="56.666666666666664" y="55" width="340" height="140" rx="8" ry="8"/>
    </clipPath>
    <clipPath id="card-clip-1">
      <rect x="453.33333333333337" y="55" width="340" height="140" rx="8" ry="8"/>
    </clipPath>
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.6; }
      }
      @keyframes orbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes card-appear {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes scan-sweep {
        0% { transform: translateY(0); }
        100% { transform: translateY(160px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect data-svg-layer="background" x="0.5" y="0.5" width="849" height="219" rx="12" ry="12" fill="#0f1623" stroke="#1a2332" stroke-width="1"/>

  <!-- Shared cosmic background -->
  <g data-cosmic-background="card" aria-hidden="true" clip-path="url(#cosmic-card-projects-constellation-clip)">
    <g class="cosmic-nebulae">
      <circle cx="593.0" cy="94.0" r="68.4" fill="#00d4ff" opacity="0.025" filter="url(#cosmic-card-projects-constellation-nebula-blur)"/>
      <circle cx="440.5" cy="178.8" r="58.2" fill="#a78bfa" opacity="0.031" filter="url(#cosmic-card-projects-constellation-nebula-blur)"/>
    </g>
    <g class="cosmic-dust" fill="#ffffff" opacity="0.12">
      <circle cx="359.2" cy="159.1" r="0.21"/>
      <circle cx="666.2" cy="18.9" r="0.25"/>
      <circle cx="143.5" cy="47.6" r="0.20"/>
      <circle cx="88.8" cy="22.2" r="0.38"/>
      <circle cx="172.7" cy="178.4" r="0.20"/>
    </g>
    <g data-cosmic-layer="far" class="cosmic-drift-far">
      <circle class="cosmic-star cosmic-star-far" cx="192.6" cy="85.9" r="0.37" fill="#00d4ff" opacity="0.16" style="--star-low:0.11; --star-high:0.22; animation-duration:12.8s; animation-delay:-10.7s"/>
      <circle class="cosmic-star cosmic-star-far" cx="671.2" cy="138.7" r="0.65" fill="#ffffff" opacity="0.16" style="--star-low:0.10; --star-high:0.21; animation-duration:15.3s; animation-delay:-6.2s"/>
      <circle class="cosmic-star cosmic-star-far" cx="820.9" cy="169.8" r="0.47" fill="#ffffff" opacity="0.18" style="--star-low:0.12; --star-high:0.25; animation-duration:12.1s; animation-delay:-1.5s"/>
      <circle class="cosmic-star cosmic-star-far" cx="115.5" cy="98.8" r="0.61" fill="#ffffff" opacity="0.16" style="--star-low:0.10; --star-high:0.21; animation-duration:15.4s; animation-delay:-4.4s"/>
      <circle class="cosmic-star cosmic-star-far" cx="534.9" cy="197.6" r="0.31" fill="#ffffff" opacity="0.19" style="--star-low:0.12; --star-high:0.25; animation-duration:15.9s; animation-delay:-5.1s"/>
      <circle class="cosmic-star cosmic-star-far" cx="725.7" cy="211.5" r="0.40" fill="#ffffff" opacity="0.11" style="--star-low:0.07; --star-high:0.15; animation-duration:12.3s; animation-delay:-3.6s"/>
      <circle class="cosmic-star cosmic-star-far" cx="322.7" cy="9.5" r="0.30" fill="#ffffff" opacity="0.13" style="--star-low:0.09; --star-high:0.18; animation-duration:9.4s; animation-delay:-8.1s"/>
      <circle class="cosmic-star cosmic-star-far" cx="573.7" cy="124.6" r="0.39" fill="#ffffff" opacity="0.18" style="--star-low:0.12; --star-high:0.24; animation-duration:13.5s; animation-delay:-3.6s"/>
      <circle class="cosmic-star cosmic-star-far" cx="732.8" cy="189.9" r="0.50" fill="#ffffff" opacity="0.27" style="--star-low:0.18; --star-high:0.37; animation-duration:15.3s; animation-delay:-11.4s"/>
      <circle class="cosmic-star cosmic-star-far" cx="821.9" cy="158.9" r="0.39" fill="#ffffff" opacity="0.27" style="--star-low:0.17; --star-high:0.36; animation-duration:13.8s; animation-delay:-9.8s"/>
    </g>
    <g data-cosmic-layer="mid" class="cosmic-drift-mid">
      <circle class="cosmic-star cosmic-star-mid" cx="533.7" cy="69.0" r="0.56" fill="#a78bfa" opacity="0.32" style="--star-low:0.20; --star-high:0.43; animation-duration:9.2s; animation-delay:-2.3s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="585.6" cy="52.7" r="0.94" fill="#ffffff" opacity="0.28" style="--star-low:0.18; --star-high:0.38; animation-duration:7.9s; animation-delay:-10.4s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="770.8" cy="13.9" r="0.97" fill="#ffffff" opacity="0.23" style="--star-low:0.15; --star-high:0.31; animation-duration:10.2s; animation-delay:-10.8s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="248.1" cy="114.8" r="0.77" fill="#ffffff" opacity="0.39" style="--star-low:0.25; --star-high:0.53; animation-duration:9.2s; animation-delay:-4.3s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="248.7" cy="5.7" r="0.83" fill="#ffffff" opacity="0.45" style="--star-low:0.29; --star-high:0.61; animation-duration:8.3s; animation-delay:-2.7s"/>
      <circle class="cosmic-star cosmic-star-mid" cx="798.4" cy="31.4" r="0.96" fill="#ffffff" opacity="0.38" style="--star-low:0.25; --star-high:0.51; animation-duration:6.6s; animation-delay:-7.0s"/>
    </g>
    <g data-cosmic-layer="near" class="cosmic-drift-near">
      <circle class="cosmic-star cosmic-star-near" cx="815.6" cy="168.6" r="1.27" fill="#ffb020" opacity="0.64" filter="url(#cosmic-card-projects-constellation-bright-glow)" style="--star-low:0.42; --star-high:0.86; animation-duration:7.0s; animation-delay:-4.9s"/>
      <circle class="cosmic-star cosmic-star-near" cx="237.1" cy="158.9" r="0.94" fill="#ffffff" opacity="0.45" style="--star-low:0.29; --star-high:0.61; animation-duration:7.4s; animation-delay:-8.7s"/>
      <circle class="cosmic-star cosmic-star-near" cx="36.4" cy="9.5" r="1.40" fill="#ffffff" opacity="0.55" style="--star-low:0.36; --star-high:0.74; animation-duration:8.8s; animation-delay:-4.6s"/>
    </g>
    <circle class="cosmic-flash" cx="366.6" cy="80.6" r="1.8" fill="#00d4ff" opacity="0.08" filter="url(#cosmic-card-projects-constellation-bright-glow)" style="animation-delay:-0.0s"/>
  </g>
  <g data-svg-layer="content">

  <!-- Grid overlay -->
  <line x1="12" y1="40" x2="838" y2="40" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.12"/>
  <line x1="12" y1="80" x2="838" y2="80" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.12"/>
  <line x1="12" y1="120" x2="838" y2="120" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.12"/>
  <line x1="12" y1="160" x2="838" y2="160" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.12"/>
  <line x1="12" y1="200" x2="838" y2="200" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.12"/>
  <line x1="80" y1="12" x2="80" y2="208" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.08"/>
  <line x1="160" y1="12" x2="160" y2="208" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.08"/>
  <line x1="240" y1="12" x2="240" y2="208" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.08"/>
  <line x1="320" y1="12" x2="320" y2="208" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.08"/>
  <line x1="400" y1="12" x2="400" y2="208" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.08"/>
  <line x1="480" y1="12" x2="480" y2="208" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.08"/>
  <line x1="560" y1="12" x2="560" y2="208" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.08"/>
  <line x1="640" y1="12" x2="640" y2="208" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.08"/>
  <line x1="720" y1="12" x2="720" y2="208" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.08"/>
  <line x1="800" y1="12" x2="800" y2="208" stroke="#64748b" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.08"/>

  <!-- Connection lines -->
  <line x1="226.7" y1="85" x2="623.3" y2="85" stroke="url(#conn-grad)" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Title area -->
  <g opacity="0.4">
    <polyline points="5,21 5,5 21,5" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <polyline points="829,5 845,5 845,21" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <polyline points="5,199 5,215 21,215" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <polyline points="829,215 845,215 845,199" fill="none" stroke="#64748b" stroke-width="1.5"/>
  </g>
  <text x="30" y="38" fill="#64748b" font-size="11" font-family="monospace" letter-spacing="3">PROJETOS EM DESTAQUE</text>
  <circle cx="218" cy="34" r="3" fill="#00d4ff" opacity="0.8" class="svg-pulse-opacity" style="--motion-low:.4; --motion-high:1; --motion-duration:2s"/>
  <text x="820" y="38" fill="#64748b" font-size="10" font-family="monospace" text-anchor="end" opacity="0.5">2 PROJETOS</text>

  <!-- Project cards -->
  <g class="project-card" opacity="0" style="animation: card-appear 0.6s ease 0.0s forwards">
    <rect x="56.666666666666664" y="55" width="340" height="140" rx="8" ry="8" fill="url(#card-bg-0)" stroke="#1a2332" stroke-width="1"/>
    <g clip-path="url(#card-clip-0)">
      <rect x="56.666666666666664" y="55" width="340" height="2" fill="#ffb020" opacity="0.1" class="svg-scan-y" style="--motion-distance:140px; --motion-duration:6s"/>
    </g>
    <circle cx="226.66666666666666" cy="85" r="14" fill="none" stroke="#ffb020" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5" class="svg-rotate" style="--motion-duration:12s"/>
    <circle cx="226.66666666666666" cy="85" r="8" fill="#ffb020" opacity="0.15" filter="url(#proj-glow-0)"/>
    <circle cx="226.66666666666666" cy="85" r="5" fill="#ffb020" opacity="0.7" class="svg-pulse-core" style="--motion-low:.5; --motion-high:.9; --motion-duration:3s; --motion-delay:0.0s"/>
    <circle cx="226.66666666666666" cy="85" r="2" fill="#ffffff" opacity="0.9"/>
    <text x="226.66666666666666" y="111" fill="#f1f5f9" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">PRISMA</text>
    <text x="226.66666666666666" y="129" fill="#94a3b8" font-size="11" font-family="sans-serif" text-anchor="middle">Plataforma interna em produção que automatiza</text>
    <text x="226.66666666666666" y="144" fill="#94a3b8" font-size="11" font-family="sans-serif" text-anchor="middle">validações complexas e processa grandes</text>
    <rect x="190.66666666666666" y="163" width="72" height="18" rx="9" ry="9" fill="#ffb020" opacity="0.12"/>
    <text x="226.66666666666666" y="175" fill="#ffb020" font-size="9" font-family="monospace" text-anchor="middle" opacity="0.85">Sistemas</text>
  </g>
  <g class="project-card" opacity="0" style="animation: card-appear 0.6s ease 0.3s forwards">
    <rect x="453.33333333333337" y="55" width="340" height="140" rx="8" ry="8" fill="url(#card-bg-1)" stroke="#1a2332" stroke-width="1"/>
    <g clip-path="url(#card-clip-1)">
      <rect x="453.33333333333337" y="55" width="340" height="2" fill="#00d4ff" opacity="0.1" class="svg-scan-y" style="--motion-distance:140px; --motion-duration:6s"/>
    </g>
    <circle cx="623.3333333333334" cy="85" r="14" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5" class="svg-rotate" style="--motion-duration:12s"/>
    <circle cx="623.3333333333334" cy="85" r="8" fill="#00d4ff" opacity="0.15" filter="url(#proj-glow-1)"/>
    <circle cx="623.3333333333334" cy="85" r="5" fill="#00d4ff" opacity="0.7" class="svg-pulse-core" style="--motion-low:.5; --motion-high:.9; --motion-duration:3s; --motion-delay:0.3s"/>
    <circle cx="623.3333333333334" cy="85" r="2" fill="#ffffff" opacity="0.9"/>
    <text x="623.3333333333334" y="111" fill="#f1f5f9" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">camup-system</text>
    <text x="623.3333333333334" y="129" fill="#94a3b8" font-size="11" font-family="sans-serif" text-anchor="middle">Sistema web colaborativo com atuação em</text>
    <text x="623.3333333333334" y="144" fill="#94a3b8" font-size="11" font-family="sans-serif" text-anchor="middle">backend, refatoração, performance e evolução</text>
    <rect x="590.8333333333334" y="163" width="65" height="18" rx="9" ry="9" fill="#00d4ff" opacity="0.12"/>
    <text x="623.3333333333334" y="175" fill="#00d4ff" font-size="9" font-family="monospace" text-anchor="middle" opacity="0.85">Backend</text>
  </g>

  <!-- Global scan line -->
  <rect x="12" y="50" width="826" height="1.5" fill="#00d4ff" opacity="0.08" class="svg-scan-y" style="--motion-distance:160px; --motion-duration:6s"/>
  </g>
</svg>